version: openfin-advice-policy-v1.0.0
decision_order:
  - request_missing_information
  - stabilize_cashflow_deficit
  - address_high_interest_debt
  - protect_emergency_liquidity
  - close_explicit_insurance_gap_as_lookup_only
  - fund_short_horizon_goal_with_liquid_principal_preserving_options
  - separate_long_horizon_goal_and_risk_discussion
hard_rules:
  - risk_tolerance_and_risk_capacity_are_separate
  - unknown_is_not_eligible
  - incomplete_product_fields_are_reference_or_comparison_only
  - no_affiliate_or_advertiser_signal_in_score
  - no_llm_generated_financial_numbers
  - user_is_final_decision_owner
response_contract:
  default_mode: decision_support
  blocked_without_verified_candidate: true
  required_fields: [mode, status, reason_codes, profile_as_of, data_as_of, assumptions, missing_information, financial_needs, candidates, decision_owner, limitations, audit_id]
